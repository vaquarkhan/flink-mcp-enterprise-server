# Publish signed artifacts to Maven Central (no local settings.xml)
name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  maven-central:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest
    steps:
      - name: Preflight secrets
        id: preflight
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=
          [ -z "$CENTRAL_USERNAME" ] && missing="${missing} CENTRAL_USERNAME"
          [ -z "$CENTRAL_TOKEN" ] && missing="${missing} CENTRAL_TOKEN"
          [ -z "$GPG_PRIVATE_KEY" ] && missing="${missing} GPG_PRIVATE_KEY"
          [ -z "$GPG_PASSPHRASE" ] && missing="${missing} GPG_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "See docs/PUBLISHING.md. Note: secret VJRSKA is not used by this workflow."
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17 + Central + GPG
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Deploy release profile
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease -DskipTests clean deploy
